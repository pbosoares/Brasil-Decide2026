services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TSE_ENABLED: ${TSE_ENABLED:-false}
      TSE_POLL_DELAY_MS: ${TSE_POLL_DELAY_MS:-30000}
      SNAPSHOT_DIRECTORY: /data
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    volumes:
      - snapshots:/data
    mem_limit: 1280m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
volumes:
  snapshots:
