name: CI/CD — validação e publicação
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend:
    name: Testes do frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testar contratos de dados
        run: npm test
      - name: Compilar frontend
        run: npm run build
      - name: Preparar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Testar interface no navegador
        run: npm run test:e2e
      - name: Guardar diagnóstico de falhas
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
  backend:
    name: Testes do backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testar e compilar backend
        run: ./mvnw -B verify
        working-directory: backend
  images:
    name: Imagens de produção
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Construir as imagens da versão testada
        env:
          RELEASE: ${{ github.sha }}
          MANIFEST_URL: ${{ vars.VITE_RESULTS_MANIFEST_URL }}
        run: |
          docker build --label "org.opencontainers.image.revision=$RELEASE" -t "brasil-decide-backend:$RELEASE" ./backend
          docker build --label "org.opencontainers.image.revision=$RELEASE" --build-arg "VITE_RESULTS_MANIFEST_URL=$MANIFEST_URL" -t "brasil-decide-frontend:$RELEASE" ./frontend
          docker compose -f deploy/compose.vps.yml config --quiet
      - name: Validar scripts e recuperação de falhas de deploy
        run: |
          bash -n deploy/receive-release.sh
          bash -n deploy/ci-smoke.sh
          python3 deploy/tests/test_receive_release.py
      - name: Testar as imagens prontas para produção
        env:
          RELEASE: ${{ github.sha }}
        run: bash deploy/ci-smoke.sh
      - name: Empacotar imagens para deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE: ${{ github.sha }}
        run: docker save "brasil-decide-backend:$RELEASE" "brasil-decide-frontend:$RELEASE" | gzip > release-images.tar.gz
      - name: Guardar imagens verificadas
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: release-images.tar.gz
          retention-days: 3
          if-no-files-found: error
  deploy:
    name: Publicação na VPS
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: brasil-decide-production
      cancel-in-progress: false
    steps:
      - name: Baixar imagens verificadas
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
      - name: Enviar imagens verificadas para a VPS
        env:
          RELEASE: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/ssh/key"' EXIT
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/key" "$VPS_USER@$VPS_HOST" "deploy $RELEASE" < release-images.tar.gz
