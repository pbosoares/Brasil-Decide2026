name: brasil-decide-2026
services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      TSE_ENABLED: ${TSE_ENABLED:-true}
      TSE_POLL_DELAY_MS: ${TSE_POLL_DELAY_MS:-30000}
      SNAPSHOT_DIRECTORY: /data
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PREFIX: ${R2_PREFIX:-results/}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    volumes:
      - snapshots:/data
    mem_limit: 1280m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build:
      context: ../frontend
      args:
        VITE_RESULTS_MANIFEST_URL: ${VITE_RESULTS_MANIFEST_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18081}:8080"
    networks:
      default:
      ecommerce_proxy:
        aliases:
          - brasil-decide-frontend
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  snapshots:
networks:
  ecommerce_proxy:
    external: true
    name: ecommerce_web
